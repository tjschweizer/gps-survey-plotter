[project]
name = "gpsrtk"
version = "0.1.0"
description = "Georeferenced terrain surfacing from RTK GNSS and rotary laser survey data"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "pillow>=10.3",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "requests>=2.32",
    "pyside6>=6.7",
    "pyqtgraph>=0.13",
    "pyvista>=0.44",
    "pyvistaqt>=0.11",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
yardsurvey = "gpsrtk.ui.main:main"

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "playwright>=1.45",
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gpsrtk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Network tests are opt-in: a public GIS service being down is a fact about the
# world, not a defect in this code. Run them with `-m network`.
addopts = "-m 'not network'"
markers = [
    "network: hits a live external service",
    "browser: drives the page in Chromium through Playwright",
]
